displayName="Studious Hotkey"
authors="WBMJunior"
description='''
Adds one keybind (default: K, in-game only) that opens Studious Keybinds' visual keyboard screen while playing.
Players can look up what a key does, or rebind it, without going through Options > Controls > Keyboard.
Client-only; does nothing without Studious Keybinds.
'''
